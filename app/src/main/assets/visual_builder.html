<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Строка — конструктор</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5fb;color:#172033;font:16px system-ui}header{position:sticky;top:0;background:white;padding:10px;display:flex;gap:8px;align-items:center;z-index:2}button{border:0;border-radius:9px;padding:10px;background:#e5eaf5;font-weight:600}.primary{background:#2563eb;color:white}.layout{display:grid;grid-template-columns:100px 1fr;gap:10px;padding:10px}.shelf{display:flex;flex-direction:column;gap:8px}.shelf button{font-size:12px}.stage{min-height:360px;background:white;border:2px dashed #bbc6d8;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}.item{padding:12px;border:1px solid transparent;border-radius:8px}.item.sel{border:2px solid #2563eb;background:#eff6ff}.hero{text-align:center;padding:25px;background:#eaf0ff;border-radius:12px}.panel{background:white;margin:10px;padding:12px;border-radius:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.panel label{font-size:12px}.panel input{width:100%;padding:8px;border:1px solid #ccd5e4;border-radius:8px}.wide{grid-column:1/-1}.code{margin:10px;width:calc(100% - 20px);height:170px;padding:10px;font:12px monospace}.preview{margin:10px;width:calc(100% - 20px);height:220px;background:white}.hint{font-size:11px;color:#667085}
</style></head><body><header><b>Конструктор сайта</b><button id="undo">↶</button><button id="voice">🎙 Голос</button><button id="show">Предпросмотр</button><button class="primary" id="save">Вставить код</button></header>
<div class="layout"><nav class="shelf"><button data-add="hero">Заголовок</button><button data-add="text">Текст</button><button data-add="image">Изображение</button><button data-add="button">Кнопка</button><button data-add="form">Форма</button><button data-add="calculator">Калькулятор</button><p class="hint">Перетаскивай блоки, чтобы менять порядок.</p></nav><main><div class="stage" id="stage"></div></main></div>
<section class="panel"><b class="wide">Свойства выбранного блока</b><label class="wide">Текст<input id="txt"></label><label>Ширина<input id="width" placeholder="100%"></label><label>Размер текста<input id="size" placeholder="18px"></label><label>Цвет<input id="color" type="color" value="#172033"></label><label>Фон<input id="bg" type="color" value="#ffffff"></label><label>Отступ<input id="pad" placeholder="12px"></label><label>Скругление<input id="radius" placeholder="8px"></label><label class="wide">URL изображения<input id="src" placeholder="https://..."></label><div class="wide"><button id="up">Выше</button><button id="down">Ниже</button><button id="del">Удалить</button></div></section>
<h3 style="padding:0 10px">HTML-код — можно редактировать вручную</h3><textarea id="code" class="code" spellcheck="false"></textarea><h3 style="padding:0 10px">Предпросмотр</h3><iframe id="frame" class="preview" sandbox="allow-scripts"></iframe>
<script>
const stage=document.querySelector('#stage'),code=document.querySelector('#code'),frame=document.querySelector('#frame');let selected=null,history=[];
const styles=`*{box-sizing:border-box}body{margin:0;padding:18px;font:16px system-ui;color:#172033;background:#f4f6fb}.page{max-width:760px;margin:auto}.hero{text-align:center;padding:25px;background:#eaf0ff;border-radius:12px}.item{margin:8px 0;padding:12px}.btn{padding:12px 18px;background:#2563eb;color:white;border:0;border-radius:8px}.form input,.form textarea{display:block;width:100%;padding:10px;margin:8px 0}.business-card{position:relative;overflow:hidden;min-height:430px;padding:34px;color:#f8fafc;background:radial-gradient(circle at 85% 12%,#315b79 0,transparent 32%),linear-gradient(145deg,#0b1726,#142d40 58%,#193d50);border-radius:24px;box-shadow:0 22px 55px #0b172633}.business-card:before{content:'';position:absolute;width:260px;height:260px;border:1px solid #ffffff24;border-radius:50%;right:-110px;bottom:-120px;box-shadow:0 0 0 24px #ffffff08,0 0 0 50px #ffffff06}.business-card .eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#9cc8d2}.business-card h1{font-size:clamp(30px,7vw,48px);line-height:1.04;letter-spacing:-1.5px;margin:26px 0 10px;color:#fff}.business-card .role{font-size:16px;color:#b8d1d8;margin:0 0 24px}.business-card .rule{width:52px;height:3px;background:#8dd3c7;border-radius:8px;margin:22px 0}.business-card .bio{max-width:440px;line-height:1.65;color:#d5e3e8}.business-card .contacts{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}.business-card .contact{display:inline-flex;padding:11px 15px;border:1px solid #ffffff4d;border-radius:999px;color:white;text-decoration:none;font-size:13px}.business-card .contact.primary{background:#a3e1d2;color:#102a35;border:0}.business-card .foot{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:36px;padding-top:16px;border-top:1px solid #ffffff25;color:#9fb9c3;font-size:11px}.business-card .monogram{position:absolute;right:28px;top:28px;width:62px;height:62px;border:1px solid #ffffff4d;border-radius:50%;display:grid;place-items:center;color:#b5e8da;font-size:19px;letter-spacing:2px}.landing-hero{padding:56px 28px;border-radius:24px;background:linear-gradient(130deg,#182f54,#4b6cb7);color:white}.landing-hero h1{font-size:clamp(34px,8vw,58px);line-height:1.05;margin:10px 0}.landing-hero p{max-width:540px;line-height:1.7;color:#e1e9ff}.landing-section{padding:34px 10px}.landing-section h2{font-size:28px}.landing-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.landing-tile{padding:18px;border:1px solid #dce4f0;border-radius:16px;background:white}.landing-cta{display:inline-block;padding:13px 20px;border-radius:999px;background:#d9f99d;color:#20320d;text-decoration:none;font-weight:700}.content-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.content-card{padding:22px;border:1px solid #e1e7f0;border-radius:18px;background:#fff;box-shadow:0 8px 28px #1b2c4610}.content-card h3{margin-top:0}.quote-card{padding:22px;border-radius:18px;background:#f0f5ff;font-size:15px;line-height:1.7}.price-card{padding:24px;border:1px solid #dce5ef;border-radius:18px;background:#fff}.price-card strong{font-size:32px}.faq-item{padding:16px 0;border-bottom:1px solid #e1e7f0}.contact-panel{padding:28px;border-radius:20px;background:#142c42;color:#f8fafc}.contact-panel a{color:#a8e5d4}`;
let pageTheme='light';
const themeCss={
 light:'',
 dark:'body{background:#111827;color:#f8fafc}.content-card,.price-card{background:#1f2937;color:#f8fafc;border-color:#374151}.quote-card{background:#26364c;color:#f8fafc}.landing-section p{color:inherit}',
 luxury:'body{background:#101010;color:#f5ead2}.content-card,.price-card{background:#1b1916;color:#f5ead2;border-color:#8e713d}.landing-hero{background:linear-gradient(130deg,#16110b,#5b4524)}.landing-cta{background:#d8bd78;color:#211807}.quote-card{background:#2a241a;color:#f5ead2}',
 minimal:'body{background:#fff;color:#202020}.content-card,.price-card{box-shadow:none;border-radius:4px}.landing-hero{background:#f4f4f4;color:#222;border-radius:4px}.landing-hero p{color:#555}.landing-cta{background:#222;color:#fff;border-radius:4px}'
};
function snap(){history.push(stage.innerHTML);if(history.length>25)history.shift()}
function block(t){let e=document.createElement('section');e.className='item';e.draggable=true;e.dataset.type=t;
const content={card:'<article class="business-card"><span class="eyebrow">PERSONAL BRAND · CONTACT CARD</span><div class="monogram">ИВ</div><h1>Ваше<br>имя</h1><p class="role">Ваша профессия · специализация</p><div class="rule"></div><p class="bio">Кратко расскажите, чем вы занимаетесь и какую пользу приносите клиентам. Добавьте сильную сторону, специализацию или своё предложение.</p><div class="contacts"><a class="contact primary" href="mailto:hello@example.com">✉ Написать</a><a class="contact" href="https://t.me/username">Telegram ↗</a><a class="contact" href="https://github.com/username">GitHub ↗</a></div><div class="foot"><span>ВАШ ГОРОД · ОНЛАЙН</span><span>LET’S BUILD SOMETHING GOOD</span></div></article>',services:'<section class="landing-section"><h2>Наши услуги</h2><div class="content-grid"><article class="content-card"><h3>Консультация</h3><p>Разберём задачу и составим понятный план действий.</p></article><article class="content-card"><h3>Разработка</h3><p>Создадим решение с фокусом на качество и удобство.</p></article><article class="content-card"><h3>Поддержка</h3><p>Поможем развивать продукт после запуска.</p></article></div></section>',reviews:'<section class="landing-section"><h2>Отзывы клиентов</h2><div class="content-grid"><blockquote class="quote-card">«Профессиональный подход, всё понятно и в срок».<br><b>— Имя клиента</b></blockquote><blockquote class="quote-card">«Получили именно тот результат, который обсуждали».<br><b>— Имя клиента</b></blockquote></div></section>',pricing:'<section class="landing-section"><h2>Тарифы</h2><div class="content-grid"><article class="price-card"><h3>Старт</h3><strong>от 0 ₽</strong><p>Базовый объём работ и консультация.</p></article><article class="price-card"><h3>Оптимум</h3><strong>от 0 ₽</strong><p>Расширенный пакет под ваши задачи.</p></article><article class="price-card"><h3>Индивидуально</h3><strong>по запросу</strong><p>Решение под особые требования.</p></article></div></section>',faq:'<section class="landing-section"><h2>Частые вопросы</h2><div class="faq-item"><b>Сколько занимает работа?</b><p>Срок зависит от объёма и согласуется до старта.</p></div><div class="faq-item"><b>Как начать?</b><p>Опишите задачу через форму или по почте.</p></div><div class="faq-item"><b>Можно ли изменить детали?</b><p>Да, согласуем этапы и точки обратной связи.</p></div></section>',contacts:'<section class="landing-section"><div class="contact-panel"><h2>Давайте обсудим ваш проект</h2><p>Напишите нам удобным способом — ответим и уточним детали.</p><p><a href="mailto:hello@example.com">hello@example.com</a></p><p><a href="https://t.me/username">Telegram ↗</a></p></div></section>',about:'<section class="landing-section"><h2>О нас</h2><p>Мы помогаем превращать сложные задачи в понятные цифровые продукты. Ценим ясность, качество и честную коммуникацию.</p></section>',gallery:'<section class="landing-section"><h2>Галерея</h2><div class="content-grid"><img src="https://placehold.co/600x400" alt="Пример работы 1" style="width:100%;border-radius:16px"><img src="https://placehold.co/600x400" alt="Пример работы 2" style="width:100%;border-radius:16px"><img src="https://placehold.co/600x400" alt="Пример работы 3" style="width:100%;border-radius:16px"></div></section>',landing:'<section class="landing-hero"><span>ВАШ БРЕНД · ВАША ИДЕЯ</span><h1>Создаём то, что работает</h1><p>Современные решения для людей и бизнеса. Чёткий процесс, продуманный дизайн и результат, который можно измерить.</p><a class="landing-cta" href="#contacts">Обсудить проект ↗</a></section><section class="landing-section"><h2>Чем мы полезны</h2><div class="landing-grid"><article class="landing-tile"><h3>Стратегия</h3><p>Понимаем задачу и выбираем правильный путь.</p></article><article class="landing-tile"><h3>Дизайн</h3><p>Создаём цельный и удобный пользовательский опыт.</p></article><article class="landing-tile"><h3>Разработка</h3><p>Превращаем макеты в быстрый работающий продукт.</p></article></div></section><section class="landing-section" id="contacts"><h2>Готовы начать?</h2><p>Расскажите о своей задаче — обсудим детали.</p><a class="landing-cta" href="mailto:hello@example.com">Связаться</a></section>',hero:'<div class="hero"><h1>Заголовок сайта</h1><p>Краткое описание</p></div>',text:'<p>Новый текстовый блок</p>',image:'<img src="https://placehold.co/640x240" alt="Изображение" style="max-width:100%">',button:'<button class="btn">Нажми меня</button>',form:'<form class="form"><h2>Форма обратной связи</h2><input placeholder="Имя"><input type="email" placeholder="Email"><textarea placeholder="Сообщение"></textarea><button type="button" class="btn">Отправить</button></form>',calculator:'<section class="calc"><h2>Калькулятор</h2><input class="calc-expression" placeholder="Например: 12*(3+4)"><button type="button" class="btn" onclick="(function(b){const c=b.parentElement,i=c.querySelector(\'.calc-expression\'),o=c.querySelector(\'output\'),v=i.value;if(!/^[0-9+*/().% -]+$/.test(v)){o.textContent=\'Недопустимое выражение\';return}try{o.textContent=String(Function(\'return (\'+v+\')\')())}catch(e){o.textContent=\'Ошибка\'}})(this)">Посчитать</button><output>0</output></section>'};e.innerHTML=content[t];return e}
function select(e){if(selected)selected.classList.remove('sel');selected=e;if(!e)return;e.classList.add('sel');document.querySelector('#txt').value=e.innerText.trim();['width','size','pad','radius'].forEach((id,i)=>document.querySelector('#'+id).value=[e.style.width,e.style.fontSize,e.style.padding,e.style.borderRadius][i]);document.querySelector('#src').value=e.querySelector('img')?.src||''}
function output(){let clone=stage.cloneNode(true);clone.querySelectorAll('.sel').forEach(e=>e.classList.remove('sel'));return '<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>'+styles+(themeCss[pageTheme]||'')+'</style></head><body><main class="page">'+clone.innerHTML+'</main></body></html>'}
function update(){code.value=output();frame.srcdoc=code.value}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{snap();let e=block(b.dataset.add);stage.append(e);select(e);update()});
stage.onclick=e=>{let el=e.target.closest('.item');if(el)select(el)};
stage.ondragstart=e=>{let el=e.target.closest('.item');if(el){selected=el;e.dataTransfer.setData('text/plain','move')}};
stage.ondragover=e=>e.preventDefault();stage.ondrop=e=>{e.preventDefault();let target=e.target.closest('.item');if(!selected||!target||selected===target)return;snap();let r=target.getBoundingClientRect();stage.insertBefore(selected,e.clientY<r.top+r.height/2?target:target.nextSibling);update()};
function prop(id,fn){document.querySelector('#'+id).onchange=()=>{if(!selected)return;snap();fn(document.querySelector('#'+id).value);update()}}
prop('txt',v=>{let x=selected.querySelector('h1,h2,p,button,output');if(x)x.textContent=v;else selected.textContent=v});prop('width',v=>selected.style.width=v);prop('size',v=>selected.style.fontSize=v);prop('pad',v=>selected.style.padding=v);prop('radius',v=>selected.style.borderRadius=v);prop('color',v=>selected.style.color=v);prop('bg',v=>selected.style.backgroundColor=v);prop('src',v=>{let x=selected.querySelector('img');if(x)x.src=v});
document.querySelector('#del').onclick=()=>{if(selected){snap();selected.remove();selected=null;update()}};document.querySelector('#up').onclick=()=>{if(selected?.previousElementSibling){snap();stage.insertBefore(selected,selected.previousElementSibling);update()}};document.querySelector('#down').onclick=()=>{if(selected?.nextElementSibling){snap();stage.insertBefore(selected.nextElementSibling,selected);update()}};
document.querySelector('#undo').onclick=()=>{let x=history.pop();if(x!==undefined){stage.innerHTML=x;selected=null;update()}};document.querySelector('#show').onclick=()=>frame.srcdoc=output();document.querySelector('#save').onclick=()=>{update();StrokaBuilder.save(code.value)};document.querySelector('#voice').onclick=()=>{document.querySelector('#voice').textContent='🎙 Слушаю…';StrokaBuilder.startVoice()};
code.onchange=()=>{try{let d=new DOMParser().parseFromString(code.value,'text/html');snap();stage.innerHTML=d.body.querySelector('.page')?.innerHTML||d.body.innerHTML;selected=null;update()}catch(e){}};
function voiceCommand(raw){
 const n=raw.toLowerCase().replace(/ё/g,'е').trim();
 if(!n)return;
 const typeOf=(v)=>/визитк|business\s*card|contact\s*card|digital\s*card/.test(v)?'card':/услуг|service/.test(v)?'services':/отзыв|review|testimonial/.test(v)?'reviews':/цен|price|тариф/.test(v)?'pricing':/вопрос|faq|часто задаваем/.test(v)?'faq':/контакт|contact/.test(v)?'contacts':/галере|gallery|портфолио|portfolio/.test(v)?'gallery':/о нас|about/.test(v)?'about':/лендинг|landing\s*page|сайт|website|web\s*site|главная страница/.test(v)?'landing':/калькулятор|calculator/.test(v)?'calculator':/форм|form/.test(v)?'form':/изображ|картин|image|picture/.test(v)?'image':/кноп|button/.test(v)?'button':/заголов|header|heading|title/.test(v)?'hero':/раздел|divider/.test(v)?'spacer':'text';
 const ordinal=n.match(/^(?:сделай|make)?\s*(?:блок|block)\s+(один|первый|раз|два|второй|три|третий|четыре|четвертый|пять|пятый|one|first|two|second|three|third|four|fourth|five|fifth|1|2|3|4|5)(?:\s+(.+))?$/);
 if(ordinal){
  const ids={'один':0,'первый':0,'раз':0,'one':0,'first':0,'1':0,'два':1,'второй':1,'two':1,'second':1,'2':1,'три':2,'третий':2,'three':2,'third':2,'3':2,'четыре':3,'четвертый':3,'four':3,'fourth':3,'4':3,'пять':4,'пятый':4,'five':4,'fifth':4,'5':4};
  const index=ids[ordinal[1]],rest=(ordinal[2]||'').replace(/^(сделай|добавь|создай|пусть будет|make|add|create)\s+/,'');
  if(rest){snap();const el=block(typeOf(rest));const old=stage.children[index];if(old)old.replaceWith(el);else stage.append(el);select(el);update();return}
  select(stage.children[index]);return
 }
 if(/визитк|business\s*card|contact\s*card/.test(n)){const el=block('card');snap();stage.replaceChildren(el);select(el);update();return}
 if(/лендинг|landing\s*page|создай сайт|create (?:a )?website/.test(n)){const el=block('landing');snap();stage.replaceChildren(el);select(el);update();return}
 if(/добавь|создай|вставь|нужен|нужна|хочу|add|create|insert|need|want|make/.test(n)){
  const el=block(typeOf(n));snap();
  const target=selected&&/(внутрь|в форму|в блок|inside|into selected)/.test(n)?selected:stage;
  target.append(el);select(el);update();return
 }
 if(/темн|тёмн|dark mode|dark theme/.test(n)){pageTheme='dark';update();return}
 if(/премиаль|дорогой стиль|luxury|black and gold/.test(n)){pageTheme='luxury';update();return}
 if(/минимал|минималист|minimal/.test(n)){pageTheme='minimal';update();return}
 if(/светл|light mode|light theme/.test(n)){pageTheme='light';update();return}
 if(/выровняй|выравнивание|по центру|center align/.test(n)&&selected){snap();selected.style.textAlign='center';update();return}
 if(/по левому краю|влево|align left/.test(n)&&selected){snap();selected.style.textAlign='left';update();return}
 if(/по правому краю|вправо|align right/.test(n)&&selected){snap();selected.style.textAlign='right';update();return}
 if(/добавь тень|сделай тень|drop shadow/.test(n)&&selected){snap();selected.style.boxShadow='0 16px 38px #17203326';update();return}
 if(/скругли|закругли|rounded corners/.test(n)&&selected){snap();selected.style.borderRadius='22px';update();return}
 if(/на всю ширину|во всю ширину|full width/.test(n)&&selected){snap();selected.style.width='100%';update();return}
 if(/увеличь шрифт|крупнее текст|larger font/.test(n)&&selected){snap();selected.style.fontSize='24px';update();return}
 if(/уменьши шрифт|мельче текст|smaller font/.test(n)&&selected){snap();selected.style.fontSize='14px';update();return}
 if(/удали|удалить|delete|remove/.test(n)){document.querySelector('#del').click();return}
 if(/выше|подними|up|move up|above/.test(n)){document.querySelector('#up').click();return}
 if(/ниже|опусти|down|move down|below/.test(n)){document.querySelector('#down').click();return}
 const width=n.match(/(?:ширин[аыу]?|width)\s+(\d+)\s*(пиксел|px|pixels)?/);if(width&&selected){selected.style.width=width[1]+'px';update();return}
 const text=n.match(/(назови|текст|надпись|text|label|title)\s+(.+)/);if(text&&selected){let el=selected.querySelector('h1,h2,p,button,output');if(el)el.textContent=text[2];else selected.textContent=text[2];select(selected);update();return}
 document.querySelector('#voice').textContent='🎙 Не поняла';
}
window.onVoiceResult=voiceCommand;

let seed=decodeURIComponent(location.hash.slice(1));if(seed){try{let d=new DOMParser().parseFromString(seed,'text/html');stage.innerHTML=d.body.querySelector('.page')?.innerHTML||d.body.innerHTML}catch(e){}}
if(!stage.children.length)['hero','text','button'].forEach(x=>stage.append(block(x)));update();
</script></body></html>
