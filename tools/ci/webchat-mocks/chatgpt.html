<!DOCTYPE html><html><head><meta charset="utf-8"><title>ChatGPT-like (мок, contenteditable)</title>
<style>body{font-family:sans-serif;margin:0;height:100vh;display:flex;flex-direction:column}main{flex:1;padding:12px}#bar{padding:12px;display:flex}#ed{flex:1;min-height:48px;border:1px solid #aaa}button{width:48px}</style></head>
<body><main id="log"></main>
<div id="bar"><div id="ed" contenteditable="true" role="textbox" aria-label="Message ChatGPT"></div><button id="b" aria-label="Send prompt" disabled>↑</button></div>
<script>
const ed=document.getElementById("ed"),b=document.getElementById("b");
ed.addEventListener("input",()=>{b.disabled=!ed.innerText.trim();});
b.addEventListener("click",()=>{const text=ed.innerText.trim();ed.innerHTML="";b.disabled=true;
 const u=document.createElement("div");u.setAttribute("data-message-author-role","user");u.textContent=text;log.appendChild(u);
 const a=document.createElement("div");a.setAttribute("data-message-author-role","assistant");log.appendChild(a);
 setTimeout(()=>{a.textContent='{"summary":"Калькулятор ChatGPT","operations":[]}';},700);});
</script></body></html>
