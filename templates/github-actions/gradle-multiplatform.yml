name: Build Gradle and Kotlin Multiplatform project

on:
  workflow_dispatch:
    inputs:
      gradle_tasks:
        description: "Gradle tasks (default: build)"
        required: false
        default: "build"
      java_version:
        description: "JDK version"
        required: false
        default: "21"
  push:
    paths:
      - "**/*.gradle"
      - "**/*.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/gradle-multiplatform.yml"

permissions:
  contents: read

jobs:
  build:
    name: Gradle on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version || '21' }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        if: runner.os == 'Linux'
        uses: android-actions/setup-android@v3
      - name: Make Gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew
      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Build all included modules and configured targets
        shell: bash
        run: |
          TASKS="${{ inputs.gradle_tasks || 'build' }}"
          ./gradlew --no-daemon --stacktrace $TASKS
      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-output-${{ matrix.os }}
          path: |
            **/build/outputs/**/*.apk
            **/build/outputs/**/*.aab
            **/build/libs/*.jar
            **/build/distributions/*
          if-no-files-found: ignore
          retention-days: 14
