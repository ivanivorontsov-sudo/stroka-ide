name: Toolchain smoke tests (Android APK + Windows EXE)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stroka-toolchain-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Build and verify a sample Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create minimal Android app fixture
        shell: bash
        run: |
          mkdir -p fixture-android/app/src/main/java/dev/stroka/fixture
          cat > fixture-android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'StrokaAndroidSmoke'
          include ':app'
          EOF
          cat > fixture-android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > fixture-android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'dev.stroka.fixture'
              compileSdk 35
              defaultConfig {
                  applicationId 'dev.stroka.fixture'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF
          cat > fixture-android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Stroka smoke test">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > fixture-android/app/src/main/java/dev/stroka/fixture/MainActivity.java <<'EOF'
          package dev.stroka.fixture;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          public final class MainActivity extends Activity {
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  TextView view = new TextView(this);
                  view.setText("APK build and launch fixture");
                  setContentView(view);
              }
          }
          EOF
      - name: Assemble APK
        run: gradle -p fixture-android --no-daemon assembleDebug
      - name: Verify APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=fixture-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package: name='dev.stroka.fixture'|sdkVersion:'23'"
          mkdir -p dist/android
          cp "$APK" dist/android/Stroka-Android-Smoke.apk
          sha256sum dist/android/Stroka-Android-Smoke.apk > dist/android/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sample-android-apk
          path: dist/android/
          if-no-files-found: error
          retention-days: 7

  windows-exe:
    name: Build and execute a sample Windows EXE
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Create minimal .NET console fixture
        shell: pwsh
        run: |
          dotnet new console --framework net8.0 --output fixture-windows
          @'
          Console.WriteLine("STROKA_WINDOWS_EXE_OK");
          '@ | Set-Content fixture-windows/Program.cs
      - name: Publish self-contained single-file win-x64 executable
        shell: pwsh
        run: |
          dotnet publish fixture-windows -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/windows
          $exe = Resolve-Path dist/windows/fixture-windows.exe
          if (!(Test-Path $exe)) { throw "EXE was not produced" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Output is not a PE/Windows executable (MZ header missing)" }
          $output = & $exe
          if ($LASTEXITCODE -ne 0 -or $output -notcontains "STROKA_WINDOWS_EXE_OK") { throw "Published EXE failed to execute: $output" }
          Get-FileHash $exe -Algorithm SHA256 | Format-List | Out-File dist/windows/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sample-windows-exe
          path: dist/windows/
          if-no-files-found: error
          retention-days: 7
