name: Build signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version
        run: |
          V=$(grep -Po 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = 0
          for p in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(p).getroot()
              t += int(r.get("tests")); f += int(r.get("failures")) + int(r.get("errors"))
          print(f"Unit tests: {t}, failed: {f}")
          open("test-summary.txt", "w").write(f"Unit tests: {t}, failed: {f}\n")
          PY

      - name: Restore keystore
        env:
          KS: ${{ secrets.STROKA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ks"
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/ks/stroka-release.jks"
          test -s "$RUNNER_TEMP/ks/stroka-release.jks"

      - name: Assemble signed release APK (arm64-v8a) and AAB
        env:
          STROKA_KEYSTORE: ${{ runner.temp }}/ks/stroka-release.jks
          STROKA_STORE_PASSWORD: ${{ secrets.STROKA_KEYSTORE_PASSWORD }}
          STROKA_KEY_PASSWORD: ${{ secrets.STROKA_KEYSTORE_PASSWORD }}
          STROKA_KEY_ALIAS: ${{ secrets.STROKA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease -Pabis=arm64-v8a
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Stroka-${VERSION}.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "dist/Stroka-${VERSION}.apk" | tee dist/signature.txt
          grep -qi "016214a577baece89cf5a72a8b71fc4f04fe43439922609fee74303432031438" dist/signature.txt
          ./gradlew --no-daemon bundleRelease -Pabis=arm64-v8a,x86_64
          cp app/build/outputs/bundle/release/app-release.aab "dist/Stroka-${VERSION}.aab"
          jarsigner -verify -certs "dist/Stroka-${VERSION}.aab" | tail -3
          keytool -printcert -jarfile "dist/Stroka-${VERSION}.aab" | grep -i "SHA256: 01:62:14:A5"
          ls -lh dist
          rm -rf "$RUNNER_TEMP/ks"

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Stroka-apk
          path: dist/
          retention-days: 7

      - name: Publish to release latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="dist/Stroka-${VERSION}.apk"
          NOTES="Строка ${VERSION} — редактор кода для Android. Подпись SHA-256: 01:62:14:A5:77:BA:EC:E8:9C:F5:A7:2A:8B:71:FC:4F:04:FE:43:43:99:22:60:9F:EE:74:30:34:32:03:14:38. $(cat test-summary.txt)"
          if gh release view latest >/dev/null 2>&1; then
            for a in $(gh release view latest --json assets -q '.assets[].name'); do
              case "$a" in Stroka-${VERSION}.apk|Stroka-${VERSION}.aab|signature.txt) ;; *) gh release delete-asset latest "$a" -y ;; esac
            done
            gh release upload latest "$APK" "dist/Stroka-${VERSION}.aab" dist/signature.txt --clobber
            gh release edit latest --notes "$NOTES"
          else
            gh release create latest "$APK" "dist/Stroka-${VERSION}.aab" dist/signature.txt --title "Строка — последняя сборка" --notes "$NOTES"
          fi
