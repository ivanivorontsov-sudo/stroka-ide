name: Build signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Keep only the newest build for this branch; stale runs must never overwrite latest.
concurrency:
  group: stroka-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-apk-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Prepare Android SDK and Termux-like staging folders
        run: |
          ln -s "$ANDROID_HOME" "$HOME/android-sdk"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          mkdir -p "$HOME/storage/downloads/StrokaBuild"
          cp app/src/main/python/stroka_runner.py "$HOME/storage/downloads/StrokaBuild/"
          cp app/src/main/python/stroka_tkinter.py "$HOME/storage/downloads/StrokaBuild/"
      - name: Create a one-file Tkinter calculator fixture
        run: |
          mkdir -p /tmp/stroka-python-fixture
          cat > /tmp/stroka-python-fixture/calculator.py <<'PY'
          import tkinter as tk
          from tkinter import messagebox
          root = tk.Tk()
          root.title("Калькулятор")
          result = tk.StringVar(value="0")
          tk.Label(root, textvariable=result).pack()
          entry = tk.Entry(root)
          entry.pack()
          def calculate():
              try:
                  result.set(str(eval(entry.get(), {"__builtins__": {}}, {})))
              except Exception as error:
                  messagebox.showerror("Ошибка", str(error))
          tk.Button(root, text="Вычислить", command=calculate).pack()
          root.mainloop()
          PY
          : > /tmp/stroka-python-fixture/requirements.txt
          (cd /tmp/stroka-python-fixture && zip -qr "$HOME/storage/downloads/StrokaBuild/project.zip" .)
      - name: Build standalone Android APK from Python source
        run: |
          bash app/src/main/assets/build-local.sh "$HOME/storage/downloads/StrokaBuild/project.zip" android-apk
          APK="$(find "$HOME/storage/downloads/StrokaBuild/output" -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          echo "Generated Python APK: $APK"
          ls -lh "$APK"
          cp "$APK" python-calculator-smoke.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Python-Calculator-APK-Smoke-Test
          path: python-calculator-smoke.apk
          retention-days: 7

  ponyatny-compiler-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check bundled compiler syntax
        run: node --check app/src/main/assets/ponyatny/yadro.js
      - name: Compile and run a Cyrillic Pонятный program
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const pony = require("./app/src/main/assets/ponyatny/yadro.js");
          const output = [];
          const errors = [];
          const source = [
            'пусть имя = "Иван"',
            'пиши "Привет, " + имя',
            'повтори 3 раза',
            '    пиши "Понятный работает"',
            'конец'
          ].join("\n");
          pony.run(source, {
            file: "smoke.pon",
            write: value => output.push(String(value)),
            writeErr: value => errors.push(String(value)),
            ask: () => "Тест",
            maxSteps: 10000,
            guard: true
          });
          assert.equal(errors.length, 0, errors.join("\n"));
          assert.match(output.join(""), /Привет, Иван/);
          assert.equal((output.join("").match(/Понятный работает/g) || []).length, 3);
          console.log("Pонятный 2.5 compile + execute smoke test: passed");
          NODE

  build:
    needs: [python-apk-smoke, ponyatny-compiler-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version
        run: |
          V=$(grep -Po 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate visual builder JavaScript
        run: |
          python3 - <<'PY'
          import re
          source = open("app/src/main/assets/visual_builder.html", encoding="utf-8").read()
          scripts = re.findall(r"<script>(.*?)</script>", source, flags=re.S | re.I)
          assert scripts, "No inline builder script found"
          open("/tmp/visual_builder.js", "w", encoding="utf-8").write("\n".join(scripts))
          PY
          node --check /tmp/visual_builder.js
          node tools/test-visual-builder.mjs

      - name: Validate local ARM64 build scripts
        run: |
          bash -n app/src/main/assets/setup-termux.sh
          bash -n app/src/main/assets/build-local.sh
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("app/src/main/AndroidManifest.xml").read_text()
          bridge = Path("app/src/main/java/org/ivanivorontsov/stroka/ui/LocalTermuxBuild.kt").read_text()
          runner = Path("app/src/main/assets/build-local.sh").read_text()
          setup = Path("app/src/main/assets/setup-termux.sh").read_text()
          tkinter = Path("app/src/main/python/stroka_tkinter.py").read_text()
          main = Path("app/src/main/java/org/ivanivorontsov/stroka/ui/MainActivity.kt").read_text()
          menu = Path("app/src/main/res/menu/main.xml").read_text()
          tutor = Path("app/src/main/java/org/ivanivorontsov/stroka/ui/SelfTutorActivity.kt").read_text()
          assert "com.termux.permission.RUN_COMMAND" in manifest
          assert "com.termux.app.RunCommandService" in bridge
          assert "stroka_runner.py" in bridge and "stroka_tkinter.py" in bridge
          assert "android-apk" in runner and "android-aab" in runner
          assert "python-app" in runner and "com.chaquo.python" in runner
          assert 'install("-r", "requirements.txt")' in runner
          assert "copyAssetTree" in runner and "PYROOT" in runner
          assert "aapt2FromMavenOverride" in setup
          assert "15859902_latest.zip" in setup
          assert "action_copy_menu" in main and "action_copy_menu" in menu
          assert "Описание скопировано" in main and "setTextIsSelectable(true)" in main
          assert "setTextIsSelectable(true)" in tutor
          assert "self.variable.get()" in tkinter
          print("Termux bridge, Python APK scaffold, Tkinter preview and copy actions: static checks passed")
          PY
          PYTHONPATH=app/src/main/python python3 - <<'PY'
          from stroka_tkinter import install
          class Callback:
              def showPreview(self, html): pass
              def waitUiEvent(self): return "__stop__"
              def postUiEvent(self, event): pass
          install(Callback())
          import tkinter as tk
          root = tk.Tk()
          value = tk.StringVar(value="before")
          tk.Label(root, textvariable=value)
          assert "before" in root._page()
          value.set("after")
          assert "after" in root._page(), "Label must refresh its StringVar text"
          print("Tkinter StringVar live-label test: passed")
          PY

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = 0
          for p in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(p).getroot()
              t += int(r.get("tests")); f += int(r.get("failures")) + int(r.get("errors"))
          print(f"Unit tests: {t}, failed: {f}")
          open("test-summary.txt", "w").write(f"Unit tests: {t}, failed: {f}\n")
          PY

      - name: Restore keystore
        env:
          KS: ${{ secrets.STROKA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ks"
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/ks/stroka-release.jks"
          test -s "$RUNNER_TEMP/ks/stroka-release.jks"

      - name: Assemble signed release APK (arm64-v8a) and AAB
        env:
          STROKA_KEYSTORE: ${{ runner.temp }}/ks/stroka-release.jks
          STROKA_STORE_PASSWORD: ${{ secrets.STROKA_KEYSTORE_PASSWORD }}
          STROKA_KEY_PASSWORD: ${{ secrets.STROKA_KEYSTORE_PASSWORD }}
          STROKA_KEY_ALIAS: ${{ secrets.STROKA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease -Pabis=arm64-v8a
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Stroka-${VERSION}.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "dist/Stroka-${VERSION}.apk" | tee dist/signature.txt
          grep -qi "016214a577baece89cf5a72a8b71fc4f04fe43439922609fee74303432031438" dist/signature.txt
          ./gradlew --no-daemon bundleRelease -Pabis=arm64-v8a,x86_64
          cp app/build/outputs/bundle/release/app-release.aab "dist/Stroka-${VERSION}.aab"
          jarsigner -verify -certs "dist/Stroka-${VERSION}.aab" | tail -3
          keytool -printcert -jarfile "dist/Stroka-${VERSION}.aab" | grep -i "SHA256: 01:62:14:A5"
          ls -lh dist
          rm -rf "$RUNNER_TEMP/ks"

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Stroka-apk
          path: dist/
          retention-days: 7

      - name: Publish to release latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          if [[ "$LATEST_SHA" != "$GITHUB_SHA" ]]; then
            echo "Skipping stale build $GITHUB_SHA; main is now $LATEST_SHA"
            exit 0
          fi
          APK="dist/Stroka-${VERSION}.apk"
          NOTES="Строка ${VERSION} — редактор кода для Android. Подпись SHA-256: 01:62:14:A5:77:BA:EC:E8:9C:F5:A7:2A:8B:71:FC:4F:04:FE:43:43:99:22:60:9F:EE:74:30:34:32:03:14:38. $(cat test-summary.txt)"
          if gh release view latest >/dev/null 2>&1; then
            for a in $(gh release view latest --json assets -q '.assets[].name'); do
              case "$a" in Stroka-${VERSION}.apk|Stroka-${VERSION}.aab|signature.txt) ;; *) gh release delete-asset latest "$a" -y ;; esac
            done
            gh release upload latest "$APK" "dist/Stroka-${VERSION}.aab" dist/signature.txt --clobber
            gh release edit latest --notes "$NOTES"
          else
            gh release create latest "$APK" "dist/Stroka-${VERSION}.aab" dist/signature.txt --title "Строка — последняя сборка" --notes "$NOTES"
          fi
