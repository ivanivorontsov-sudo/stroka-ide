name: Verify Android build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/ide-toolchain-upgrade]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;36.0.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and run unit tests
        env:
          STROKA_EVIDENCE: ${{ runner.temp }}/stroka-evidence
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stroka-test-reports
          path: app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Stroka-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Stroka-generated-app-smoke-tests
          path: ${{ runner.temp }}/stroka-evidence/*
          if-no-files-found: ignore
          retention-days: 7

      - name: Run generated APK interaction tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: yes
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest
            mkdir -p "${{ runner.temp }}/generated-calculator"
            adb pull "/sdcard/Android/data/org.ivanivorontsov.stroka/files/build-out/Калькулятор-java.apk" "${{ runner.temp }}/generated-calculator/Калькулятор-java.apk"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Stroka-java-calculator-device-test
          path: ${{ runner.temp }}/generated-calculator/Калькулятор-java.apk
          if-no-files-found: ignore
          retention-days: 7
