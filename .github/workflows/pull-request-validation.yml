name: Pull request validation

on:
  push:
    branches: [feature/embedded-local-builder]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stroka-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate visual builder and generated runtime
        run: |
          python3 - <<'PY'
          import re
          source = open("app/src/main/assets/visual_builder.html", encoding="utf-8").read()
          scripts = re.findall(r"<script>(.*?)</script>", source, flags=re.S | re.I)
          assert scripts, "No inline JavaScript found in visual builder"
          open("/tmp/visual_builder.js", "w", encoding="utf-8").write("\\n".join(scripts))
          PY
          node --check /tmp/visual_builder.js
          node --check app/src/main/assets/ponyatny/yadro.js
          node tools/test-visual-builder.mjs
      - name: Validate shell build scripts
        run: |
          bash -n app/src/main/assets/setup-termux.sh
          bash -n app/src/main/assets/build-local.sh
      - name: Run unit tests and compile debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease
      - name: Verify debug APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='org.ivanivorontsov.stroka'"
          sha256sum "$APK" > app-debug.sha256
          RELEASE_APK=app/build/outputs/apk/release/app-release.apk
          test -s "$RELEASE_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$RELEASE_APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$RELEASE_APK" | grep "package: name='org.ivanivorontsov.stroka'"
          sha256sum "$RELEASE_APK" > app-release.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Stroka-release-candidate
          path: |
            app/build/outputs/apk/release/app-release.apk
            app-release.sha256
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Stroka-debug-validation
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.sha256
          if-no-files-found: error
          retention-days: 7
